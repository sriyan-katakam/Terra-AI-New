
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Supermercado+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="decorative-edges" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <span class="holo-grid"></span>
    </div>

    <div id="loading-container">
        <h2>🔐 Checking Login...</h2>
        <div class="form-status">Please wait</div>
    </div>

    <div id="login-container" style="display: none;">
        <h2>🔐 Login to Terra</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="login-divider">or</div>
        <button id="google-login-button" class="google-button" type="button">
            <span class="google-mark">G</span>
            Continue with Google
        </button>
        <div id="login-status" class="form-status"></div>
        <p>Don't have an account? <a href="#" id="signup-link">Sign up</a></p>
        <div id="login-error"></div>
    </div>

    <div id="signup-container" style="display: none;">
        <h2>✨ Sign Up</h2>
        <form id="signup-form">
            <input type="email" id="signup-email" placeholder="Email" required>
            <input type="password" id="signup-password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <div class="login-divider">or</div>
        <button id="google-signup-button" class="google-button" type="button">
            <span class="google-mark">G</span>
            Sign up with Google
        </button>
        <div id="signup-status" class="form-status"></div>
        <p>Already have an account? <a href="#" id="login-link">Login</a></p>
        <div id="signup-error"></div>
    </div>

    <div id="about-container" style="display: none;">
        <h2>👤 About Me</h2>
        <form id="about-form">
            <input type="text" id="about-name" placeholder="Name" required>
            <label for="about-dob">Date of birth</label>
            <input type="date" id="about-dob" aria-label="Date of birth" required>
            <label for="about-photo">Profile photo</label>
            <input type="file" id="about-photo" accept="image/*">
            <button type="submit">Continue to Terra</button>
        </form>
        <div id="about-status" class="form-status"></div>
        <div id="about-error"></div>
    </div>

    <div id="chat-container" style="display: none;">
        <div class="chat-header">
            <div class="chat-brand">
                <div class="profile-avatar" aria-hidden="true"></div>
                <h2>🌿 Welcome to Terra!</h2>
            </div>
            <div class="settings-menu">
                <button id="settings-button" type="button" aria-label="Open settings" aria-expanded="false">⚙️</button>
                <div id="settings-panel" class="settings-panel">
                    <button id="about-button" type="button">About Me</button>
                    <button id="logout-button" type="button">Logout</button>
                </div>
            </div>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button id="mic-button" type="button" aria-label="Use microphone">🎙️</button>
            <button id="send-button">Send</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="script.js"></script>
</body>
</html>
